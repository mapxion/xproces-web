server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index home.html index.html;

    location ^~ /telegram/ {
        proxy_pass http://mapxion_api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin/telegram/ {
        proxy_pass http://mapxion_api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La raíz pública muestra home.html. Conserva los enlaces temporales
    # de vista de cliente que antes podían apuntar a /?client_preview=...
    location = / {
        if ($arg_client_preview != "") {
            return 302 /area-privada?$args;
        }
        try_files /home.html =404;
    }

    # Evita que Google encuentre copias de la portada con otra URL.
    location = /home {
        return 301 /;
    }

    location = /home.html {
        return 301 /;
    }

    # Aplicación actual, sin mover sus scripts ni recursos.
    location = /area-privada {
        try_files /index.html =404;
    }

    location = /area-privada/ {
        return 301 /area-privada;
    }

    location = /index.html {
        return 301 /area-privada;
    }

    # Conserva el comportamiento anterior para archivos, admin y otras rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
